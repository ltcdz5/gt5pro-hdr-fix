<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1faff">
<title>HDR 分区调色</title>
<style>
:root{--bg:#f1faff;--surf:#fff;--surf2:#e6f1f8;--on:#121c22;--on2:#4a5c66;
  --pri:#00658f;--outline:#c3d6e0;--r:#e5484d;--g:#30a46c;--b:#0091ff}
[data-theme="dark"]{--bg:#0d1418;--surf:#151e24;--surf2:#1d2830;--on:#dfe8ee;
  --on2:#a5b6c0;--pri:#7fd0ff;--outline:#33454f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--on);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(16px + var(--window-inset-top,0px)) 16px calc(28px + var(--window-inset-bottom,0px))}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
.sub{font-size:13px;color:var(--on2);margin-bottom:14px;line-height:1.55}
.seg{display:flex;gap:6px;background:var(--surf2);padding:5px;border-radius:14px;margin-bottom:13px}
.seg button{flex:1;border:none;background:transparent;color:var(--on2);padding:10px;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--surf);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card{background:var(--surf);border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;justify-content:space-between}
.t{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
.v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.s{font-size:12px;color:var(--on2);margin-top:3px;line-height:1.5}
input[type=range]{width:100%;margin:12px 0 2px;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--surf2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--pri);margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.btns{display:flex;gap:10px;margin-top:8px}
button.main{flex:1;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:600;
  background:var(--pri);color:#fff;cursor:pointer}
button.ghost{flex:1;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:600;
  background:var(--surf2);color:var(--on);cursor:pointer}
button:disabled{opacity:.5}
.mono{font-size:12px;color:var(--on2);font-family:ui-monospace,monospace;word-break:break-all;line-height:1.65}
.pill{padding:3px 11px;border-radius:999px;font-size:12px;background:var(--surf2);color:var(--on2)}
.pill.on{background:var(--pri);color:#fff}
#msg{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--on);color:var(--surf);
  padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;
  max-width:86vw;text-align:center;z-index:99}
</style>
</head>
<body>
<h1>HDR 分区调色</h1>
<div class="sub">白色和灰色的偏色程度不同，所以分开调：先选中一段，再调 RGB。点「应用」立即生效。</div>

<div class="seg" id="seg">
  <button data-z="lo">暗部</button>
  <button data-z="mid" class="on">中调</button>
  <button data-z="hi">高光</button>
</div>

<div class="card">
  <div class="row"><div class="t"><span class="dot" style="background:var(--r)"></span>红 R</div><div class="v" id="vR" style="color:var(--r)">100%</div></div>
  <input type="range" id="rg" min="60" max="120" step="1" value="100">
</div>
<div class="card">
  <div class="row"><div class="t"><span class="dot" style="background:var(--g)"></span>绿 G</div><div class="v" id="vG" style="color:var(--g)">100%</div></div>
  <input type="range" id="gg" min="60" max="120" step="1" value="100">
</div>
<div class="card">
  <div class="row"><div class="t"><span class="dot" style="background:var(--b)"></span>蓝 B</div><div class="v" id="vB" style="color:var(--b)">100%</div></div>
  <input type="range" id="bg" min="60" max="180" step="1" value="100">
</div>

<div class="card">
  <div class="row"><div class="t">预估</div><div class="mono" id="preview">—</div></div>
  <div class="s">白点看「高光」段，灰阶看「中调」段；B/R 与 R/G 接近 1.000 即中性。<br>高光段加蓝会等比压 R/G，亮度会下降——白点处 B 已接近满量程，这是唯一手段。</div>
</div>

<div class="card">
  <div class="row">
    <div><div class="t">启用校正</div><div class="s">关闭后完全走原厂表</div></div>
    <div class="pill" id="enPill">--</div>
  </div>
  <div class="btns">
    <button class="main" id="btnApply">应用</button>
    <button class="ghost" id="btnSaveUser">保存为我的预设</button>
    <button class="ghost" id="btnLoadUser">载入我的预设</button>
  </div>
  <div class="btns">
    <button class="ghost" id="btnResetCal">恢复作者校准</button>
    <button class="ghost" id="btnResetStock">恢复原厂</button>
  </div>
</div>

<div class="card">
  <div class="row"><div class="t">状态</div><div class="v" id="hit" style="font-size:13px">—</div></div>
  <div class="mono" id="stats">读取中…</div>
</div>

<div id="msg"></div>
<script>
var MODDIR = "/data/adb/modules/hdrfix";
var BASE_URL = MODDIR + "/base_land.bin";
var baseBytes = null, baseW = null, baseM = null, baseL = null;
var zone = "mid";
var G = {
  lo:  { r:1.00, g:1.00, b:1.00 },
  mid: { r:1.00, g:1.00, b:1.39 },
  hi:  { r:0.92, g:1.00, b:1.00 }
};

function getKsu(){
  if (typeof window.ksu !== "undefined" && window.ksu && window.ksu.exec) return window.ksu;
  if (typeof ksu !== "undefined" && ksu && ksu.exec) return ksu;
  if (typeof KernelSU !== "undefined" && KernelSU && KernelSU.exec) return KernelSU;
  return null;
}
function SH(cmd){
  return new Promise(function(ok){
    var k = getKsu();
    if(!k){ ok({errno:-1,stdout:"",stderr:"no ksu api"}); return; }
    var cb = "__cb" + Date.now() + Math.floor(Math.random()*1e5);
    window[cb] = function(errno, stdout, stderr){
      try{ delete window[cb]; }catch(e){}
      ok({errno:errno, stdout:(stdout||""), stderr:(stderr||"")});
    };
    try{ k.exec(cmd, "window." + cb); }
    catch(e){ try{ delete window[cb]; }catch(x){} ok({errno:-1,stdout:"",stderr:String(e)}); }
  });
}
function TOAST(m){
  var t = document.getElementById("msg");
  t.textContent = m; t.style.opacity = "1";
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.style.opacity = "0"; }, 2200);
}
function b64dec(s){
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function b64enc(u){
  var s = "", CH = 0x2000;
  for (var i=0;i<u.length;i+=CH) s += String.fromCharCode.apply(null, u.subarray(i, i+CH));
  return btoa(s);
}
var COL_OFF = 204, ROW = 1229, GRID3 = 4913;

function smooth(t){ return t*t*(3-2*t); }
function wLo(v){ return v<=0.25?1:(v>=0.55?0:1-smooth((v-0.25)/0.30)); }
function wHi(v){ return v<=0.45?0:(v>=0.75?1:smooth((v-0.45)/0.30)); }
function wMid(v){ var m = 1-wLo(v)-wHi(v); return m<0?0:m; }

function rdEntry(d, n){
  var view = new DataView(d.buffer, d.byteOffset, d.byteLength);
  var o = COL_OFF + Math.floor(n/4)*8 + (n%4)*ROW*8;
  var c2c1 = view.getUint32(o, true), c0 = view.getUint32(o+4, true);
  return { R: c0, G: (c2c1 >>> 16) & 0xfff, B: c2c1 & 0xfff };
}
function toLin(c){ var v = c/4095; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
function lumOf(R,G,B){ return 0.2126*toLin(R)+0.7152*toLin(G)+0.0722*toLin(B); }

/* 单点变换：分区增益 + 蓝比补偿
   蓝滑块表示"目标 B/R 倍数"；B 被 4095 卡住时，等比下调 R/G 补足。 */
function xform(R, Gc, B, z){
  var v = Math.max(R, Gc, B) / 4095;
  var a = wLo(v), m = wMid(v), hh = wHi(v);
  var gr = a*z.lo.r  + m*z.mid.r  + hh*z.hi.r;
  var gg = a*z.lo.g  + m*z.mid.g  + hh*z.hi.g;
  var gb = a*z.lo.b  + m*z.mid.b  + hh*z.hi.b;

  var R2 = Math.min(4095, R  * gr);
  var G2 = Math.min(4095, Gc * gg);
  var B2 = Math.min(4095, B  * gb);

  if (gb > 1 && R2 > 0){
    var wantBR = (B * gb) / (R * gr);        // 未裁剪时的目标蓝红比
    var haveBR = B2 / R2;
    if (haveBR < wantBR){
      var kk = (B2 / wantBR) / R2;           // 需要把 R/G 缩到多少
      if (kk < 1){
        R2 = R2 * kk;
        G2 = G2 * kk;
      }
    }
  }
  return { R: Math.round(R2), G: Math.round(G2), B: Math.round(B2) };
}

function buildTable(src, z){
  var d = new Uint8Array(src);
  var view = new DataView(d.buffer);
  for (var n=0;n<GRID3;n++){
    var o = COL_OFF + Math.floor(n/4)*8 + (n%4)*ROW*8;
    var c2c1 = view.getUint32(o, true), c0 = view.getUint32(o+4, true);
    var R = c0, Gc = (c2c1 >>> 16) & 0xfff, B = c2c1 & 0xfff;
    var t = xform(R, Gc, B, z);
    view.setUint32(o, ((t.G << 16) | t.B) >>> 0, true);   // hi=G, lo=B
    view.setUint32(o+4, t.R, true);                        // c0=R
  }
  return d;
}
function pct(v){ return Math.round(v*100) + "%"; }
function applyZoneToSliders(){
  var z = G[zone];
  document.getElementById("rg").value = Math.round(z.r*100);
  document.getElementById("gg").value = Math.round(z.g*100);
  document.getElementById("bg").value = Math.round(z.b*100);
  syncLabels();
}
function readSliders(){
  var z = G[zone];
  z.r = parseInt(document.getElementById("rg").value,10)/100;
  z.g = parseInt(document.getElementById("gg").value,10)/100;
  z.b = parseInt(document.getElementById("bg").value,10)/100;
}
function syncLabels(){
  readSliders();
  var z = G[zone];
  document.getElementById("vR").textContent = pct(z.r);
  document.getElementById("vG").textContent = pct(z.g);
  document.getElementById("vB").textContent = pct(z.b);
  if (baseW){
    var w = xform(baseW.R, baseW.G, baseW.B, G);
    var mg = xform(baseM.R, baseM.G, baseM.B, G);
    var y0 = lumOf(baseW.R, baseW.G, baseW.B), y1 = lumOf(w.R, w.G, w.B);
    document.getElementById("preview").innerHTML =
      "白 B/R " + (w.B/w.R).toFixed(3) + " R/G " + (w.R/w.G).toFixed(3) +
      " 亮度 " + Math.round(y1/y0*100) + "%" +
      "<br>灰 B/R " + (mg.B/mg.R).toFixed(3) + " R/G " + (mg.R/mg.G).toFixed(3);
  }
}
async function loadState(){
  var r = await SH("sh " + MODDIR + "/webctl.sh json");
  try{
    var j = JSON.parse(r.stdout.trim());
    G.lo  = { r:parseFloat(j.rlo),  g:parseFloat(j.glo),  b:parseFloat(j.blo)  };
    G.mid = { r:parseFloat(j.rmid), g:parseFloat(j.gmid), b:parseFloat(j.bmid) };
    G.hi  = { r:parseFloat(j.rhi),  g:parseFloat(j.ghi),  b:parseFloat(j.bhi)  };
    var pill = document.getElementById("enPill");
    pill.textContent = (j.enable === "1") ? "已启用" : "已停用";
    pill.className = "pill" + (j.enable === "1" ? " on" : "");
    document.getElementById("stats").textContent = j.stats || "—";
    var mm = (j.stats||"").match(/land=(\d+)/);
    document.getElementById("hit").textContent = mm ? ("横屏命中 " + mm[1]) : "—";
  }catch(e){ TOAST("读取失败"); }
  applyZoneToSliders();
}
async function loadBase(){
  if (baseBytes) return baseBytes;
  var r = await SH("base64 -w0 " + BASE_URL);
  if (r.errno !== 0 || !r.stdout){ TOAST("读取基准表失败"); return null; }
  baseBytes = b64dec(r.stdout.replace(/\s/g,""));
  baseW = rdEntry(baseBytes, 16*289+16*17+16);
  baseM = rdEntry(baseBytes, 8*289+8*17+8);
  baseL = rdEntry(baseBytes, 4*289+4*17+4);
  return baseBytes;
}
async function apply(){
  var btn = document.getElementById("btnApply");
  readSliders();
  btn.disabled = true;
  try{
    var src = await loadBase(); if(!src) return;
    var out = buildTable(src, G);
    var b64 = b64enc(out);
    await SH("sh " + MODDIR + "/webctl.sh begin");
    var CH = 8000;
    for (var i=0;i<b64.length;i+=CH){
      var rr = await SH("sh " + MODDIR + "/webctl.sh chunk '" + b64.slice(i, i+CH) + "'");
      if (rr.errno !== 0){ TOAST("写入中断"); return; }
    }
    var c = await SH("sh " + MODDIR + "/webctl.sh commit");
    if ((c.stdout||"").trim() !== "ok"){ TOAST("提交失败: " + (c.stdout||"").trim()); return; }
    await SH("sh " + MODDIR + "/webctl.sh save " +
      G.lo.r.toFixed(2)  + " " + G.lo.g.toFixed(2)  + " " + G.lo.b.toFixed(2)  + " " +
      G.mid.r.toFixed(2) + " " + G.mid.g.toFixed(2) + " " + G.mid.b.toFixed(2) + " " +
      G.hi.r.toFixed(2)  + " " + G.hi.g.toFixed(2)  + " " + G.hi.b.toFixed(2));
    await SH("sh " + MODDIR + "/webctl.sh enable 1");
    TOAST("已应用");
    await loadState();
  } finally { btn.disabled = false; }
}
async function saveUser(){
  await SH("sh " + MODDIR + "/webctl.sh saveuser");
  TOAST("已保存为我的预设");
  await loadState();
}
async function loadUser(){
  var r = await SH("sh " + MODDIR + "/webctl.sh loaduser");
  if(String(r).indexOf("no-preset") >= 0) TOAST("还没有保存过预设");
  else TOAST("已载入我的预设");
  await loadState();
}
async function resetCal(){
  await SH("sh " + MODDIR + "/webctl.sh reset cal");
  TOAST("已恢复我的校准");
  await loadState();
}
async function resetStock(){
  await SH("sh " + MODDIR + "/webctl.sh reset stock");
  TOAST("已恢复原厂");
  await loadState();
}
document.getElementById("seg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-z]");
  if(!b) return;
  readSliders();
  zone = b.getAttribute("data-z");
  Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function(x){
    x.classList.toggle("on", x === b);
  });
  applyZoneToSliders();
});
["rg","gg","bg"].forEach(function(id){
  document.getElementById(id).addEventListener("input", syncLabels);
});
document.getElementById("btnApply").addEventListener("click", apply);
document.getElementById("btnSaveUser").addEventListener("click", saveUser);
document.getElementById("btnLoadUser").addEventListener("click", loadUser);
document.getElementById("btnResetCal").addEventListener("click", resetCal);
document.getElementById("btnResetStock").addEventListener("click", resetStock);
(function init(){
  try{
    var t = localStorage.getItem("hdrfix_theme");
    if(!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
  loadBase().then(loadState);
})();
</script>
</body>
</html>
